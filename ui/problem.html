<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeArena — Problem</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        /* Monaco replaces the old textarea; these rules keep it sized inside the editor pane. */
        #monaco-container {
            width: 100%;
            height: 60vh;
            min-height: 360px;
            overflow: hidden;
            border: 1px solid var(--border, #30363d);
            border-radius: 8px;
        }

        .editor-wrap {
            min-width: 0;
        }

        .editor-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 2px 0;
        }

        @media (max-width: 700px) {
            #monaco-container {
                height: 55vh;
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <main class="problem-layout">
        <!-- LEFT PANE — Problem statement -->
        <section class="problem-statement">
            <div id="problem-header" class="mb-24">
                <div class="loading-block">
                    <span class="spinner"></span><span>Loading problem…</span>
                </div>
            </div>
            <div id="statement"></div>
        </section>

        <!-- RIGHT PANE — Editor, submit and verdict -->
        <aside class="problem-editor">
            <div class="editor-inner">
                <div class="editor-toolbar">
                    <div class="editor-lang">
                        <label for="language">Language</label>
                        <select id="language">
                            <option value="c">C</option>
                            <option value="cpp">C++</option>
                            <option value="python">Python</option>
                        </select>
                    </div>
                    <div class="editor-actions">
                        <button id="clear-btn" class="btn ghost" title="Clear editor">Clear</button>
                        <button id="submit-btn" class="btn">Submit</button>
                    </div>
                </div>

                <div class="editor-wrap">
                    <div id="monaco-container" aria-label="Source code editor"></div>
                    <div class="editor-status">
                        <span id="char-count" class="muted">0 / 65536</span>
                        <span id="submit-status" class="muted" aria-live="polite"></span>
                    </div>
                </div>

                <div id="result-card" class="result-card hidden">
                    <div class="result-header">
                        <span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;">
                            Latest submission
                        </span>
                        <a id="view-full" href="#" class="muted" style="font-size:12px;">View details →</a>
                    </div>
                    <div id="result-body"></div>
                </div>
            </div>
        </aside>
    </main>

    <script src="static/app.js"></script>
    <script type="module">
        import {
            initMonaco,
            getEditorValue,
            setEditorValue,
            setEditorLanguage,
            onEditorChange,
            focusEditor
        } from "./static/editor.js";

        "use strict";

        (async function () {
            if (!requireAuth("problems")) return;

            const params = new URLSearchParams(location.search);
            const problemId = parseInt(params.get("id") || "0", 10);

            const header = document.getElementById("problem-header");
            const statement = document.getElementById("statement");
            const language = document.getElementById("language");
            const submitBtn = document.getElementById("submit-btn");
            const clearBtn = document.getElementById("clear-btn");
            const submitStat = document.getElementById("submit-status");
            const charCount = document.getElementById("char-count");
            const resultCard = document.getElementById("result-card");
            const resultBody = document.getElementById("result-body");
            const viewFull = document.getElementById("view-full");

            if (!problemId) {
                toast("No problem selected", "error");
                location.href = "problems.html";
                return;
            }

            const savedLang = localStorage.getItem("codearena_lang");
            if (savedLang && ["c", "cpp", "python"].includes(savedLang)) {
                language.value = savedLang;
            }

            const draftKey = "codearena_source_" + problemId;
            const savedDraft = localStorage.getItem(draftKey) || "";
            const monacoLanguageMap = { c: "c", cpp: "cpp", python: "python" };

            function updateCharCount(value = getEditorValue()) {
                charCount.textContent = `${value.length} / 65536`;
            }

            let draftTimer = null;
            function saveDraft(value = getEditorValue()) {
                if (draftTimer) clearTimeout(draftTimer);
                draftTimer = setTimeout(() => {
                    try {
                        localStorage.setItem(draftKey, value);
                    } catch (err) {
                        console.warn("Could not save code draft:", err);
                    }
                }, 300);
            }

            try {
                await initMonaco(language.value, savedDraft);
                onEditorChange((value) => {
                    updateCharCount(value);
                    saveDraft(value);
                });
                updateCharCount(savedDraft);
            } catch (err) {
                console.error("Monaco initialization failed:", err);
                toast("The code editor could not be loaded. Check your internet connection and refresh.", "error");
                submitBtn.disabled = true;
                submitStat.textContent = "Editor failed to load";
                return;
            }

            language.addEventListener("change", () => {
                const lang = language.value;
                localStorage.setItem("codearena_lang", lang);
                setEditorLanguage(monacoLanguageMap[lang] || "c");
            });

            clearBtn.addEventListener("click", () => {
                if (getEditorValue() && !confirm("Clear the editor?")) return;
                setEditorValue("");
                localStorage.removeItem(draftKey);
                updateCharCount("");
                focusEditor();
            });

            // Load the selected problem statement.
            try {
                const p = await Api.getProblem(problemId);
                document.title = `CodeArena — ${p.title}`;

                clear(header);
                header.appendChild(el("h1", { text: p.title }));
                header.appendChild(el("div", { class: "problem-meta" }, [
                    difficultyBadge(p.difficulty),
                    el("span", { class: "meta-pill", text: `⏱ ${p.time_limit_ms} ms` }),
                    el("span", { class: "meta-pill", text: `🧠 ${p.memory_limit_mb} MB` })
                ]));

                clear(statement);
                if (p.description) statement.appendChild(renderSection("Description", p.description));
                if (p.input_format) statement.appendChild(renderSection("Input", p.input_format));
                if (p.output_format) statement.appendChild(renderSection("Output", p.output_format));
                if (p.constraints) statement.appendChild(renderSection("Constraints", p.constraints));
            } catch (err) {
                clear(header);
                header.appendChild(el("p", { text: err.message || "Failed to load problem" }));
                toast(err.message || "Failed to load problem", "error");
            }

            function renderSection(title, body) {
                return el("section", { class: "statement-section" }, [
                    el("h3", { text: title }),
                    el("div", { class: "statement-body", text: body })
                ]);
            }

            submitBtn.addEventListener("click", async () => {
                const sourceCode = getEditorValue();
                if (!sourceCode.trim()) {
                    toast("Source code is empty", "warn");
                    focusEditor();
                    return;
                }
                if (sourceCode.length > 65536) {
                    toast("Source code exceeds the 65536 character limit", "warn");
                    return;
                }

                // Save immediately before submitting so the latest draft survives navigation.
                if (draftTimer) clearTimeout(draftTimer);
                localStorage.setItem(draftKey, sourceCode);

                submitBtn.disabled = true;
                submitBtn.textContent = "Submitting…";
                clear(submitStat);
                submitStat.appendChild(el("span", { class: "spinner" }));
                submitStat.appendChild(document.createTextNode(" Submitting"));

                try {
                    const r = await Api.submit(problemId, language.value, sourceCode);
                    toast(`Submission #${r.id} created`, "success");
                    showResult(r.id);
                } catch (err) {
                    toast(err.message || "Submit failed", "error");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit";
                    submitStat.textContent = "";
                }
            });

            function showResult(subId) {
                resultCard.classList.remove("hidden");
                viewFull.href = `submission.html?id=${subId}`;

                if (window.innerWidth < 900) {
                    resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
                }

                const stop = poll(async () => {
                    const s = await Api.getSubmission(subId);
                    renderResult(s);
                    if (["COMPLETED", "FAILED", "CANCELLED"].includes(s.status)) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Submit";
                        submitStat.textContent = "";
                        if (s.result && s.result.verdict === "AC") {
                            toast("Accepted!", "success");
                        } else if (s.result) {
                            toast(`Verdict: ${s.result.verdict}`, "warn");
                        }
                        return true;
                    }
                    return false;
                }, 1500);

                window.addEventListener("beforeunload", () => stop(), { once: true });
            }

            function renderResult(s) {
                clear(resultBody);
                const r = s.result;
                const verdict = r ? r.verdict : s.status;

                resultBody.appendChild(el("div", { class: `result-verdict ${verdict}` }, [
                    el("div", { class: "result-verdict-name", text: verdict }),
                    r && el("div", { class: "result-verdict-metrics" }, [
                        r.runtime_ms != null && el("span", { text: `${r.runtime_ms} ms` }),
                        r.memory_kb != null && el("span", { text: `${formatNumber(r.memory_kb)} KB` }),
                        el("span", { text: `score ${r.score}` })
                    ].filter(Boolean))
                ]));

                if (r && r.stderr) {
                    resultBody.appendChild(el("div", { class: "result-error" }, [
                        el("div", { class: "result-error-label", text: "Error output" }),
                        el("pre", { class: "code-block error-output", text: r.stderr })
                    ]));
                }
            }
        })();
    </script>
</body>

</html>
