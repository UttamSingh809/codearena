<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        // Apply theme immediately (FOUC prevention)
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Admin</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        /* Simple admin layout */
        .admin-container { display: flex; gap: 32px; }
        .admin-sidebar { width: 200px; flex-shrink: 0; }
        .admin-content { flex: 1; min-width: 0; }
        .admin-nav a {
            display: block; padding: 12px 16px; color: var(--secondary);
            text-decoration: none; border-radius: var(--radius-sm);
            margin-bottom: 4px; font-weight: 500; transition: background 0.15s;
        }
        .admin-nav a:hover { background: var(--neutral-deep); color: var(--primary); }
        .admin-nav a.active { background: var(--tertiary-dim); color: var(--tertiary); }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="wide">
        <div class="admin-container">
            <!-- Sidebar -->
            <aside class="admin-sidebar">
                <h2 style="font-size: 1.2rem; margin-bottom: 24px;">Admin Panel</h2>
                <nav class="admin-nav">
                    <a href="#" class="active" id="nav-stats">Overview</a>
                    <a href="#" id="nav-users">Users</a>
                    <a href="#" id="nav-analytics">Analytics</a>
                    <a href="#" id="nav-jobs">Job Queue</a>
                    <a href="#" id="nav-create">Create Problem</a>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <div class="admin-content" id="admin-content">
                <div class="loading-block"><span class="spinner lg"></span><span>Loading dashboard…</span></div>
            </div>
        </div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function () {
            if (!requireAuth('admin')) return;

            const user = Auth.getUser();
            // RBAC Check
            if (!user || user.role !== 'admin') {
                // Not an admin, redirect
                location.href = 'dashboard.html';
                return;
            }

            const content = document.getElementById('admin-content');

            // Navigation
            document.getElementById('nav-stats').onclick = (e) => { e.preventDefault(); loadStats(e.target); };
            document.getElementById('nav-users').onclick = (e) => { e.preventDefault(); loadUsers(e.target); };
            document.getElementById('nav-analytics').onclick = (e) => { e.preventDefault(); loadAnalytics(e.target); };
            document.getElementById('nav-jobs').onclick = (e) => { e.preventDefault(); loadJobs(e.target); };
            document.getElementById('nav-create').onclick = (e) => { e.preventDefault(); loadCreateProblem(e.target); };

            function setActiveNav(clickedEl) {
                document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('active'));
                clickedEl.classList.add('active');
            }

            // ---- Load Overview Stats ----
            async function loadStats(elClicked) {
                setActiveNav(elClicked);
                content.innerHTML = `<div class="loading-block"><span class="spinner"></span><span>Loading stats…</span></div>`;

                try {
                    const stats = await apiFetch('/api/admin/stats');

                    content.innerHTML = '';
                    content.appendChild(el('h1', { text: 'Platform Overview', style: { marginBottom: '24px' } }));

                    const grid = el('div', { class: 'card-grid mb-24' });
                    const statCard = (label, value) => el('div', { class: 'stat' }, [
                        el('div', { class: 'stat-label', text: label }),
                        el('div', { class: 'stat-value', text: String(value) })
                    ]);

                    grid.appendChild(statCard('Total Users', stats.total_users));
                    grid.appendChild(statCard('Total Problems', stats.total_problems));
                    grid.appendChild(statCard('Total Submissions', stats.total_submissions));
                    grid.appendChild(statCard('Pending Jobs', (stats.pending_jobs || 0) + (stats.processing_jobs || 0)));

                    content.appendChild(grid);
                } catch (err) {
                    toast(err.message || 'Failed to load stats', 'error');
                }
            }

            // ---- Load User Management ----
            async function loadUsers(elClicked) {
                setActiveNav(elClicked);
                content.innerHTML = '';

                content.appendChild(el('h1', { text: 'User Management', style: { marginBottom: '24px' } }));

                // Search bar
                const searchBar = el('div', { class: 'filter-bar' }, [
                    el('input', { type: 'search', id: 'admin-user-search', placeholder: 'Search by username or email...' }),
                    el('button', { class: 'btn secondary', text: 'Search', onclick: () => fetchUsers() })
                ]);
                content.appendChild(searchBar);

                const tableContainer = el('div', { id: 'admin-users-table' });
                content.appendChild(tableContainer);

                async function fetchUsers() {
                    const q = document.getElementById('admin-user-search').value.trim();
                    const url = q ? `/api/admin/users?search=${encodeURIComponent(q)}` : '/api/admin/users';

                    tableContainer.innerHTML = `<div class="loading-block"><span class="spinner"></span><span>Loading users…</span></div>`;

                    try {
                        const users = await apiFetch(url);
                        tableContainer.innerHTML = '';

                        if (users.length === 0) {
                            tableContainer.appendChild(el('p', { class: 'muted', text: 'No users found.' }));
                            return;
                        }

                        const table = el('table');
                        table.appendChild(el('thead', {}, [
                            el('tr', {}, [
                                el('th', { text: 'ID' }),
                                el('th', { text: 'Username' }),
                                el('th', { text: 'Email' }),
                                el('th', { text: 'Role' }),
                                el('th', { text: 'XP' }),
                                el('th', { text: 'Actions' })
                            ])
                        ]));

                        const tbody = el('tbody');
                        users.forEach(u => {
                            const isBanned = u.is_banned;

                            tbody.appendChild(el('tr', {}, [
                                el('td', { class: 'mono muted', text: String(u.id) }),
                                el('td', {
                                    text: u.username,
                                    style: { color: isBanned ? 'var(--danger)' : 'inherit', textDecoration: isBanned ? 'line-through' : 'none' }
                                }),
                                el('td', { class: 'muted', text: u.email }),
                                el('td', {}, [el('span', { class: `badge ${u.role === 'admin' ? 'AC' : 'PENDING'}`, text: u.role })]),
                                el('td', { class: 'num', text: String(u.xp) }),
                                el('td', {}, [
                                    // Ban/Unban button
                                    el('button', {
                                        class: `btn ghost ${isBanned ? 'success' : 'danger'}`,
                                        text: isBanned ? 'Unban' : 'Ban',
                                        onclick: async () => {
                                            if (!confirm(`Are you sure you want to ${isBanned ? 'unban' : 'ban'} ${u.username}?`)) return;
                                            try {
                                                await apiFetch(`/api/admin/users/${u.id}/ban?ban=${!isBanned}`, { method: 'PUT' });
                                                toast(`User ${isBanned ? 'unbanned' : 'banned'}`, 'success');
                                                fetchUsers(); // refresh
                                            } catch (err) {
                                                toast(err.message, 'error');
                                            }
                                        }
                                    })
                                ])
                            ]));
                        });
                        table.appendChild(tbody);
                        tableContainer.appendChild(el('div', { class: 'table-wrap' }, [table]));

                    } catch (err) {
                        tableContainer.innerHTML = `<p class="error">${err.message}</p>`;
                    }
                }

                // Initial load
                fetchUsers();
            }

            // ---- Load Job Queue Monitor ----
            async function loadJobs(elClicked) {
                setActiveNav(elClicked);
                content.innerHTML = `<div class="loading-block"><span class="spinner"></span><span>Loading job queue…</span></div>`;

                try {
                    const data = await apiFetch('/api/admin/jobs');

                    content.innerHTML = '';
                    content.appendChild(el('h1', { text: 'Job Queue Monitor', style: { marginBottom: '24px' } }));

                    // Stats Row
                    const grid = el('div', { class: 'card-grid mb-24' });
                    const statCard = (label, value, color) => el('div', { class: 'stat' }, [
                        el('div', { class: 'stat-label', text: label }),
                        el('div', { class: 'stat-value', text: String(value), style: { color: color } })
                    ]);

                    grid.appendChild(statCard('Pending Jobs', data.counts.pending, 'var(--secondary)'));
                    grid.appendChild(statCard('Processing Jobs', data.counts.processing, 'var(--tertiary)'));
                    grid.appendChild(statCard('Failed Jobs', data.counts.failed, 'var(--danger)'));
                    grid.appendChild(statCard('Active Workers', data.active_workers.length, 'var(--success)'));
                    content.appendChild(grid);

                    // Worker Details
                    if (data.active_workers.length > 0) {
                        content.appendChild(el('h3', { text: 'Active Workers', style: { marginTop: '32px', marginBottom: '16px' } }));
                        const workerTable = el('table');
                        workerTable.appendChild(el('thead', {}, [
                            el('tr', {}, [el('th', { text: 'Worker ID' }), el('th', { text: 'Active Jobs' })])
                        ]));
                        const wtBody = el('tbody');
                        data.active_workers.forEach(w => {
                            wtBody.appendChild(el('tr', {}, [
                                el('td', { class: 'mono', text: w.worker_id }),
                                el('td', { text: String(w.active_jobs) })
                            ]));
                        });
                        workerTable.appendChild(wtBody);
                        content.appendChild(el('div', { class: 'table-wrap mb-24' }, [workerTable]));
                    }

                    // Recent Failures
                    if (data.recent_failures && data.recent_failures.length > 0) {
                        content.appendChild(el('h3', { text: 'Recent Failures', style: { marginTop: '32px', marginBottom: '16px' } }));
                        const failTable = el('table');
                        failTable.appendChild(el('thead', {}, [
                            el('tr', {}, [
                                el('th', { text: 'Submission' }),
                                el('th', { text: 'Problem' }),
                                el('th', { text: 'Worker' }),
                                el('th', { text: 'Retries' }),
                                el('th', { text: 'Started' })
                            ])
                        ]));
                        const ftBody = el('tbody');
                        data.recent_failures.forEach(f => {
                            ftBody.appendChild(el('tr', {}, [
                                el('td', { class: 'mono', text: String(f.id) }),
                                el('td', { class: 'mono muted', text: String(f.problem_id) }),
                                el('td', { class: 'mono muted', text: f.worker_id || '—' }),
                                el('td', { class: 'num', text: String(f.retry_count ?? 0) }),
                                el('td', { class: 'muted', text: f.processing_started_at ? formatDate(f.processing_started_at) : '—' })
                            ]));
                        });
                        failTable.appendChild(ftBody);
                        content.appendChild(el('div', { class: 'table-wrap mb-24' }, [failTable]));
                    }
                } catch (err) {
                    toast(err.message || 'Failed to load jobs', 'error');
                }
            }

            // ---- Load Platform Analytics ----
            async function loadAnalytics(elClicked) {
                setActiveNav(elClicked);
                content.innerHTML = `<div class="loading-block"><span class="spinner"></span><span>Loading analytics…</span></div>`;

                try {
                    const data = await apiFetch('/api/admin/analytics?days=14');

                    content.innerHTML = '';
                    content.appendChild(el('h1', { text: 'Platform Analytics (14 Days)', style: { marginBottom: '24px' } }));

                    // Aggregate data by day
                    const byDay = {};
                    data.forEach(row => {
                        const day = row.day;
                        if (!byDay[day]) byDay[day] = { AC: 0, WA: 0, OTHER: 0, total: 0 };
                        const count = parseInt(row.count, 10);
                        byDay[day].total += count;
                        if (row.verdict === 'AC') byDay[day].AC += count;
                        else if (row.verdict === 'WA') byDay[day].WA += count;
                        else byDay[day].OTHER += count;
                    });

                    // Find max for scaling
                    const maxTotal = Math.max(...Object.values(byDay).map(d => d.total), 1);

                    const chartContainer = el('div', { class: 'chart-container' });

                    Object.keys(byDay).forEach(day => {
                        const d = byDay[day];
                        const colHeightPct = (d.total / maxTotal) * 100;
                        const acPct = d.total > 0 ? (d.AC / d.total) * 100 : 0;
                        const waPct = d.total > 0 ? (d.WA / d.total) * 100 : 0;
                        const otherPct = d.total > 0 ? (d.OTHER / d.total) * 100 : 0;

                        const col = el('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', height: '100%', justifyContent: 'flex-end' } }, [
                            el('div', { style: { height: `${colHeightPct}%`, width: '100%', display: 'flex', flexDirection: 'column', borderRadius: '4px 4px 0 0', overflow: 'hidden' } }, [
                                el('div', { class: 'chart-bar-segment ac', style: { height: `${acPct}%` } }),
                                el('div', { class: 'chart-bar-segment wa', style: { height: `${waPct}%` } }),
                                el('div', { class: 'chart-bar-segment other', style: { height: `${otherPct}%` } })
                            ]),
                            el('div', { class: 'chart-label', text: String(day).slice(5) }) // Show MM-DD
                        ]);
                        chartContainer.appendChild(col);
                    });

                    content.appendChild(chartContainer);

                    // Legend
                    content.appendChild(el('div', { class: 'chart-legend' }, [
                        el('div', { class: 'chart-legend-item' }, [el('div', { class: 'chart-dot', style: { background: 'var(--tertiary)' } }), el('span', { text: 'Accepted' })]),
                        el('div', { class: 'chart-legend-item' }, [el('div', { class: 'chart-dot', style: { background: 'var(--danger)' } }), el('span', { text: 'Wrong Answer' })]),
                        el('div', { class: 'chart-legend-item' }, [el('div', { class: 'chart-dot', style: { background: 'var(--secondary)' } }), el('span', { text: 'Other' })])
                    ]));

                } catch (err) {
                    toast(err.message || 'Failed to load analytics', 'error');
                }
            }

            // ---- Load Create Problem Form ----
            function loadCreateProblem(elClicked) {
                setActiveNav(elClicked);
                content.innerHTML = '';

                content.appendChild(el('h1', { text: 'Create Problem', style: { marginBottom: '24px' } }));
                content.appendChild(el('p', { class: 'muted', style: { marginBottom: '24px' }, text: 'Fill in the details below. Test cases must have an expected output.' }));

                const form = el('form', { id: 'create-problem-form' });

                // --- Basic Info ---
                form.appendChild(el('div', { class: 'card mb-24' }, [
                    el('h3', { text: 'Basic Info' }),
                    el('div', { class: 'field' }, [
                        el('label', { text: 'Title' }),
                        el('input', { type: 'text', id: 'cp-title', required: true })
                    ]),
                    el('div', { class: 'field' }, [
                        el('label', { text: 'Description' }),
                        el('textarea', { id: 'cp-desc', required: true, style: { minHeight: '100px' } })
                    ]),
                    el('div', { class: 'field' }, [
                        el('label', { text: 'Input Format' }),
                        el('input', { type: 'text', id: 'cp-input' })
                    ]),
                    el('div', { class: 'field' }, [
                        el('label', { text: 'Output Format' }),
                        el('input', { type: 'text', id: 'cp-output' })
                    ]),
                    el('div', { class: 'field' }, [
                        el('label', { text: 'Constraints' }),
                        el('input', { type: 'text', id: 'cp-constraints' })
                    ])
                ]));

                // --- Limits ---
                form.appendChild(el('div', { class: 'card mb-24' }, [
                    el('h3', { text: 'Limits' }),
                    el('div', { class: 'flex gap-16' }, [
                        el('div', { class: 'field', style: { flex: 1 } }, [
                            el('label', { text: 'Time Limit (ms)' }),
                            el('input', { type: 'number', id: 'cp-time', value: '2000', min: '1' })
                        ]),
                        el('div', { class: 'field', style: { flex: 1 } }, [
                            el('label', { text: 'Memory Limit (MB)' }),
                            el('input', { type: 'number', id: 'cp-memory', value: '256', min: '1' })
                        ]),
                        el('div', { class: 'field', style: { flex: 1 } }, [
                            el('label', { text: 'Difficulty' }),
                            el('select', { id: 'cp-difficulty' }, [
                                el('option', { value: 'easy', text: 'Easy' }),
                                el('option', { value: 'medium', text: 'Medium' }),
                                el('option', { value: 'hard', text: 'Hard' })
                            ])
                        ])
                    ])
                ]));

                // --- Test Cases Container ---
                const tcContainer = el('div', { class: 'card mb-24' }, [
                    el('div', { class: 'flex', style: { justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } }, [
                        el('h3', { text: 'Test Cases', style: { margin: 0 } }),
                        el('button', { type: 'button', class: 'btn secondary', text: '+ Add Test Case', onclick: addTestCase })
                    ]),
                    el('div', { id: 'tc-list' })
                ]);
                form.appendChild(tcContainer);

                form.appendChild(el('div', { class: 'flex', style: { justifyContent: 'flex-end' } }, [
                    el('button', { type: 'submit', class: 'btn', text: 'Create Problem' })
                ]));

                content.appendChild(form);

                // --- Test Case Builder Logic ---
                let tcCount = 0;

                function addTestCase(data = { input_data: '', expected_output: '', is_sample: false }) {
                    tcCount++;
                    const tcId = 'tc-' + tcCount;
                    const wrapper = el('div', { id: tcId, style: { padding: '16px', border: '1px solid var(--neutral-deep)', borderRadius: '8px', marginBottom: '16px', position: 'relative' } });

                    wrapper.appendChild(el('button', {
                        type: 'button',
                        class: 'btn ghost',
                        text: '✕',
                        style: { position: 'absolute', top: '8px', right: '8px', color: 'var(--danger)' },
                        onclick: () => wrapper.remove()
                    }));

                    wrapper.appendChild(el('div', { class: 'flex gap-16', style: { marginBottom: '12px' } }, [
                        el('div', { class: 'field', style: { flex: 1 } }, [
                            el('label', { text: 'Input' }),
                            el('textarea', { class: 'tc-input', style: { minHeight: '60px', fontFamily: 'var(--font-mono)' }, text: data.input_data })
                        ]),
                        el('div', { class: 'field', style: { flex: 1 } }, [
                            el('label', { text: 'Expected Output' }),
                            el('textarea', { class: 'tc-expected', style: { minHeight: '60px', fontFamily: 'var(--font-mono)' }, text: data.expected_output })
                        ])
                    ]));

                    wrapper.appendChild(el('label', { class: 'flex gap-8', style: { alignItems: 'center', fontSize: '13px', color: 'var(--secondary)' } }, [
                        el('input', { type: 'checkbox', class: 'tc-sample', checked: data.is_sample }),
                        'Is this a sample test case? (visible to users)'
                    ]));

                    document.getElementById('tc-list').appendChild(wrapper);
                }

                // Add one empty test case by default
                addTestCase();

                // --- Form Submission ---
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const btn = form.querySelector('button[type="submit"]');
                    btn.disabled = true;
                    btn.textContent = 'Creating...';

                    // Gather test cases
                    const tcElements = document.querySelectorAll('#tc-list > div');
                    const test_cases = [];
                    let valid = true;

                    tcElements.forEach(wrapper => {
                        const input = wrapper.querySelector('.tc-input').value;
                        const expected = wrapper.querySelector('.tc-expected').value;
                        const is_sample = wrapper.querySelector('.tc-sample').checked;

                        if (!expected.trim()) {
                            valid = false;
                        }

                        test_cases.push({
                            input_data: input,
                            expected_output: expected,
                            is_sample: is_sample,
                            points: 10
                        });
                    });

                    if (!valid || test_cases.length === 0) {
                        if (!valid) toast('Test cases must have an expected output', 'error');
                        btn.disabled = false;
                        btn.textContent = 'Create Problem';
                        return;
                    }

                    const payload = {
                        title: document.getElementById('cp-title').value,
                        description: document.getElementById('cp-desc').value,
                        input_format: document.getElementById('cp-input').value || null,
                        output_format: document.getElementById('cp-output').value || null,
                        constraints: document.getElementById('cp-constraints').value || null,
                        time_limit_ms: parseInt(document.getElementById('cp-time').value, 10),
                        memory_limit_mb: parseInt(document.getElementById('cp-memory').value, 10),
                        difficulty: document.getElementById('cp-difficulty').value,
                        test_cases: test_cases
                    };

                    try {
                        await apiFetch('/api/admin/problems', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        toast('Problem created successfully!', 'success');
                        loadStats(document.getElementById('nav-stats')); // Go back to overview
                    } catch (err) {
                        toast(err.message || 'Failed to create problem', 'error');
                        btn.disabled = false;
                        btn.textContent = 'Create Problem';
                    }
                };
            }

            // Load default view
            loadStats(document.getElementById('nav-stats'));

        })();
    </script>
</body>
</html>
