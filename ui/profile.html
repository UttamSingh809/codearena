<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Profile</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" tabindex="-1">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="leaderboard.html">Leaderboard</a>
            <span class="sep">/</span>
            <span class="current" id="profile-breadcrumb-title">Loading…</span>
        </nav>
        <div id="profile-view">
            <div class="loading-block"><span class="spinner lg"></span><span>Loading…</span></div>
        </div>
    </main>

    <div id="edit-modal" class="shortcuts-backdrop hidden"
        role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
        <section class="shortcuts-modal" style="max-width:500px;">
            <header class="shortcuts-header">
                <h2 id="edit-profile-title">Edit Profile</h2>
                <button id="close-edit-modal" class="shortcuts-close" type="button"
                    aria-label="Close edit profile dialog">✕</button>
            </header>
            <div class="shortcuts-body">
                <form id="edit-form">
                    <div class="field">
                        <label for="edit-avatar">Avatar URL</label>
                        <input type="url" id="edit-avatar" maxlength="2048"
                            placeholder="https://example.com/avatar.jpg">
                        <span class="muted" style="font-size:11px;">Use an HTTP or HTTPS image URL.</span>
                    </div>
                    <div class="field">
                        <label for="edit-bio">Bio</label>
                        <textarea id="edit-bio" rows="4" maxlength="200"
                            placeholder="Tell us about yourself..."
                            style="min-height:80px;font-family:var(--font-sans);"></textarea>
                    </div>
                    <p id="edit-error" class="field-error hidden" role="alert"></p>
                    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:24px;">
                        <button id="cancel-edit-modal" type="button" class="btn ghost">Cancel</button>
                        <button type="submit" class="btn" id="save-profile-btn">Save</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function () {
            if (!requireAuth('profile')) return;

            const params = new URLSearchParams(location.search);
            const username = params.get('user');
            const container = document.getElementById('profile-view');
            const breadcrumbTitle = document.getElementById('profile-breadcrumb-title');
            const currentUser = Auth.getUser();
            const isOwnProfile = currentUser && currentUser.username === username;
            const editModal = document.getElementById('edit-modal');
            const editForm = document.getElementById('edit-form');
            const avatarInput = document.getElementById('edit-avatar');
            const bioInput = document.getElementById('edit-bio');
            const editError = document.getElementById('edit-error');
            const saveButton = document.getElementById('save-profile-btn');
            let profileData = null;
            let heatmapData = null;
            let modalReturnFocus = null;

            function closeEditModal() {
                editModal.classList.remove('visible');
                editModal.classList.add('hidden');
                if (modalReturnFocus) modalReturnFocus.focus();
            }

            function openEditModal() {
                avatarInput.value = profileData.avatar_url || '';
                bioInput.value = profileData.bio || '';
                editError.textContent = '';
                editError.classList.add('hidden');
                modalReturnFocus = document.activeElement;
                editModal.classList.remove('hidden');
                void editModal.offsetWidth;
                editModal.classList.add('visible');
                avatarInput.focus();
            }

            document.getElementById('close-edit-modal').addEventListener('click', closeEditModal);
            document.getElementById('cancel-edit-modal').addEventListener('click', closeEditModal);
            editModal.addEventListener('click', event => {
                if (event.target === editModal) closeEditModal();
            });
            window.addEventListener('keydown', event => {
                if (event.key === 'Escape' && editModal.classList.contains('visible')) {
                    closeEditModal();
                }
            });

            if (!username) {
                emptyState(container, 'No user selected',
                    'Open a profile from the leaderboard.');
                return;
            }

            (async () => {
                // Render skeletons
                container.innerHTML = `
                    <div class="skeleton skeleton-title" style="width:200px;height:32px;margin-bottom:8px;"></div>
                    <div class="skeleton skeleton-line medium" style="margin-bottom:24px;"></div>
                    <div class="card-grid mb-24">
                        <div class="skeleton-stat"></div>
                        <div class="skeleton-stat"></div>
                        <div class="skeleton-stat"></div>
                        <div class="skeleton-stat"></div>
                    </div>
                    <div class="skeleton-editor-body" style="height:180px;"></div>
                `;

                try {
                    const [profile, heatmap] = await Promise.all([
                        apiFetchWithRetry(`/api/users/${encodeURIComponent(username)}`),
                        apiFetchWithRetry(`/api/stats/heatmap?username=${encodeURIComponent(username)}&days=365`),
                    ]);

                    profileData = profile;
                    heatmapData = heatmap;
                    document.title = `CodeArena — ${profile.username}`;
                    breadcrumbTitle.textContent = profile.username;
                    renderProfile(container, profile, heatmap);
                } catch (err) {
                    console.error('Failed to load profile:', err);
                    emptyState(container, 'Failed to load profile', friendlyErrorMessage(err));
                }
            })();

            editForm.addEventListener('submit', async event => {
                event.preventDefault();
                if (!isOwnProfile || !profileData) return;

                const avatarUrl = avatarInput.value.trim() || null;
                const bio = bioInput.value.trim() || null;
                saveButton.disabled = true;
                saveButton.textContent = 'Saving…';
                editError.textContent = '';
                editError.classList.add('hidden');

                try {
                    await apiFetch('/api/users/me/profile', {
                        method: 'PUT',
                        body: JSON.stringify({ avatar_url: avatarUrl, bio }),
                    });

                    profileData = { ...profileData, avatar_url: avatarUrl, bio };
                    Auth.saveToken(Auth.getToken(), {
                        ...Auth.getUser(),
                        avatar_url: avatarUrl,
                        bio,
                    });
                    closeEditModal();
                    renderProfile(container, profileData, heatmapData);
                    toast('Profile updated.', 'success');
                } catch (err) {
                    console.error('Failed to update profile:', err);
                    editError.textContent = friendlyErrorMessage(err, 'Could not update profile.');
                    editError.classList.remove('hidden');
                } finally {
                    saveButton.disabled = false;
                    saveButton.textContent = 'Save';
                }
            });

            function renderProfile(container, profile, heatmap) {
                clear(container);

                // Header: avatar, username, bio, and owner controls
                const initial = profile.username.charAt(0).toUpperCase();
                const avatar = el('div', {
                    class: 'avatar profile-avatar',
                    role: 'img',
                    'aria-label': `${profile.username}'s avatar`,
                    style: { width: '80px', height: '80px', fontSize: '32px' },
                    text: initial,
                });
                if (profile.avatar_url) {
                    avatar.appendChild(el('img', {
                        class: 'avatar-image',
                        src: profile.avatar_url,
                        alt: '',
                        referrerpolicy: 'no-referrer',
                        onerror: event => event.currentTarget.remove(),
                    }));
                }

                const profileHeader = el('div', {
                    style: { display: 'flex', gap: '24px', alignItems: 'center', marginBottom: '32px' }
                }, [
                    avatar,
                    el('div', { style: { flex: 1 } }, [
                        el('h1', { text: profile.username, style: { margin: 0, fontSize: '2rem' } }),
                        el('p', {
                            class: 'muted',
                            text: `Joined ${formatDate(profile.joined_at)} · ${profile.role}`,
                            style: { margin: '4px 0 0' },
                        }),
                        profile.bio && el('p', {
                            text: profile.bio,
                            style: { margin: '8px 0 0', whiteSpace: 'pre-wrap' },
                        }),
                    ]),
                    isOwnProfile && el('button', {
                        class: 'btn',
                        type: 'button',
                        text: 'Edit Profile',
                        onclick: openEditModal,
                    }),
                ]);
                container.appendChild(profileHeader);

                // Stats grid
                const statsGrid = el('div', { class: 'card-grid mb-24' }, [
                    statCard('Global Rank', profile.rank ? `#${profile.rank}` : '—', 'across all users'),
                    statCard('Score', profile.total_score, 'total points'),
                    statCard('Solved', profile.total_solved, 'problems with AC'),
                    statCard('Submissions', profile.total_submissions, 'all time'),
                ]);
                container.appendChild(statsGrid);

                // Heat-map
                const heatmapContainer = el('div', { id: 'profile-heatmap' });
                container.appendChild(heatmapContainer);
                renderHeatmap(heatmapContainer, heatmap);
            }

            function statCard(label, value, sub) {
                return el('div', { class: 'stat' }, [
                    el('div', { class: 'stat-label', text: label }),
                    el('div', { class: 'stat-value', text: String(value) }),
                    sub && el('div', { class: 'stat-sub', text: sub }),
                ]);
            }

            function renderHeatmap(container, data) {
                // Reuse the same code as dashboard's heatmap
                const start = new Date(data.start + 'T00:00:00Z');
                const end = new Date(data.end + 'T00:00:00Z');
                const startSunday = new Date(start);
                startSunday.setUTCDate(startSunday.getUTCDate() - startSunday.getUTCDay());

                const days = [];
                const cursor = new Date(startSunday);
                while (cursor <= end) {
                    const key = cursor.toISOString().slice(0, 10);
                    const inRange = cursor >= start && cursor <= end;
                    days.push({
                        date: new Date(cursor),
                        key,
                        count: inRange ? (data.days[key] || 0) : -1,
                        inRange,
                    });
                    cursor.setUTCDate(cursor.getUTCDate() + 1);
                }

                const columns = [];
                for (let i = 0; i < days.length; i += 7) {
                    columns.push(days.slice(i, i + 7));
                }

                const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

                function levelFor(count) {
                    if (count <= 0) return 0;
                    if (count <= 2) return 1;
                    if (count <= 5) return 2;
                    if (count <= 10) return 3;
                    return 4;
                }

                const card = el('div', { class: 'heatmap-card' });
                card.appendChild(el('div', { class: 'heatmap-header' }, [
                    el('h3', { text: 'Submission Activity' }),
                    el('span', {
                        class: 'heatmap-total',
                        text: `${data.total} submission${data.total === 1 ? '' : 's'} in the last year`,
                    }),
                ]));

                const scroll = el('div', { class: 'heatmap-scroll' });
                const outer = el('div');

                // Month labels
                const monthLabels = el('div', { class: 'heatmap-months' });
                let lastMonth = -1;
                for (const week of columns) {
                    const first = week.find(d => d && d.inRange);
                    if (!first) {
                        monthLabels.appendChild(el('span', { text: '' }));
                        continue;
                    }
                    const m = first.date.getUTCMonth();
                    if (m !== lastMonth) {
                        monthLabels.appendChild(el('span', { text: MONTHS[m] }));
                        lastMonth = m;
                    } else {
                        monthLabels.appendChild(el('span', { text: '' }));
                    }
                }
                outer.appendChild(monthLabels);

                // Grid
                const grid = el('div', { class: 'heatmap-grid' });
                const dayLabels = el('div', { class: 'heatmap-days' });
                for (let i = 0; i < 7; i++) {
                    const show = i === 1 || i === 3 || i === 5;
                    dayLabels.appendChild(el('span', {
                        text: show ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][i] : '',
                        class: show ? '' : 'empty',
                    }));
                }
                grid.appendChild(dayLabels);

                const columnsContainer = el('div', { class: 'heatmap-columns' });
                for (const week of columns) {
                    const weekCol = el('div', { class: 'heatmap-week' });
                    for (let dow = 0; dow < 7; dow++) {
                        const day = week[dow];
                        if (!day || !day.inRange) {
                            weekCol.appendChild(el('div', {
                                class: 'heatmap-cell',
                                style: { visibility: 'hidden' },
                            }));
                            continue;
                        }
                        const level = levelFor(day.count);
                        weekCol.appendChild(el('div', {
                            class: `heatmap-cell level-${level}`,
                            'data-date': day.key,
                            'data-count': String(day.count),
                            title: `${day.count} submission${day.count === 1 ? '' : 's'} on ${day.key}`,
                        }));
                    }
                    columnsContainer.appendChild(weekCol);
                }
                grid.appendChild(columnsContainer);
                outer.appendChild(grid);

                // Legend
                outer.appendChild(el('div', { class: 'heatmap-legend' }, [
                    el('span', { text: 'Less' }),
                    el('div', { class: 'heatmap-cell level-0' }),
                    el('div', { class: 'heatmap-cell level-1' }),
                    el('div', { class: 'heatmap-cell level-2' }),
                    el('div', { class: 'heatmap-cell level-3' }),
                    el('div', { class: 'heatmap-cell level-4' }),
                    el('span', { text: 'More' }),
                ]));

                scroll.appendChild(outer);
                card.appendChild(scroll);
                container.appendChild(card);
            }
        })();
    </script>
</body>

</html>
