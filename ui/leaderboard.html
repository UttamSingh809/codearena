<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        // Apply theme immediately to prevent flash of wrong theme
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Leaderboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <main>
        <h1>Leaderboard</h1>
        <p class="muted mb-24">Global ranking across all problems.</p>

        <div id="leaderboard-view"></div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function() {
            if (!requireAuth('leaderboard')) return;

            const container = document.getElementById('leaderboard-view');

            // 4. Render Skeleton immediately
            loadingState(container, 'leaderboard');

            (async() => {
                try {
                    const rows = await Api.leaderboard(100, 0);

                    if (!rows.length) {
                        emptyState(container, 'No rankings yet',
                            'Be the first to submit a solution!');
                        return;
                    }

                    const table = el('table');
                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', {
                                text: 'Rank'
                            }),
                            el('th', {
                                text: 'User'
                            }),
                            el('th', {
                                class: 'num',
                                text: 'Score'
                            }),
                            el('th', {
                                class: 'num',
                                text: 'Solved'
                            }),
                            el('th', {
                                class: 'num',
                                text: 'Submissions'
                            }),
                        ]),
                    ]));
                    const tbody = el('tbody');
                    for (const r of rows) {
                        const rank = r.rank;
                        let medalClass = 'plain';
                        if (rank === 1) medalClass = 'gold';
                        else if (rank === 2) medalClass = 'silver';
                        else if (rank === 3) medalClass = 'bronze';

                        tbody.appendChild(el('tr', {}, [
                            el('td', {}, [
                                el('span', {
                                    class: `rank-medal ${medalClass}`,
                                    text: String(rank)
                                }),
                            ]),
                            el('td', {
                                text: r.username
                            }),
                            el('td', {
                                class: 'num',
                                text: String(r.total_score)
                            }),
                            el('td', {
                                class: 'num',
                                text: String(r.total_solved)
                            }),
                            el('td', {
                                class: 'num',
                                text: String(r.total_submissions)
                            }),
                        ]));
                    }
                    table.appendChild(tbody);

                    clear(container);
                    container.appendChild(el('div', {
                        class: 'table-wrap'
                    }, [table]));
                } catch (err) {
                    emptyState(container, 'Failed to load', err.message || 'Unknown error');
                    toast(err.message || 'Failed to load leaderboard', 'error');
                }
            })();
        })();
    </script>
</body>

</html>
