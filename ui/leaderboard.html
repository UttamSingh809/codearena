<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeArena — Leaderboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <main>
        <h1>Leaderboard</h1>
        <p class="muted mb-24">Global ranking across all problems.</p>

        <div id="leaderboard-view">
            <div class="loading-block"><span class="spinner"></span><span>Loading…</span></div>
        </div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function () {
            if (!requireAuth('leaderboard')) return;

            const container = document.getElementById('leaderboard-view');

            (async () => {
                try {
                    const rows = await Api.leaderboard(100, 0);

                    if (!rows.length) {
                        emptyState(container, 'No rankings yet',
                            'Be the first to submit a solution!');
                        return;
                    }

                    const table = el('table');
                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', { text: 'Rank' }),
                            el('th', { text: 'User' }),
                            el('th', { class: 'num', text: 'Score' }),
                            el('th', { class: 'num', text: 'Solved' }),
                            el('th', { class: 'num', text: 'Submissions' }),
                        ]),
                    ]));
                    const tbody = el('tbody');
                    for (const r of rows) {
                        const rank = r.rank;
                        let medalClass = 'plain';
                        if (rank === 1) medalClass = 'gold';
                        else if (rank === 2) medalClass = 'silver';
                        else if (rank === 3) medalClass = 'bronze';

                        tbody.appendChild(el('tr', {}, [
                            el('td', {}, [
                                el('span', { class: `rank-medal ${medalClass}`, text: String(rank) }),
                            ]),
                            el('td', { text: r.username }),
                            el('td', { class: 'num', text: String(r.total_score) }),
                            el('td', { class: 'num', text: String(r.total_solved) }),
                            el('td', { class: 'num', text: String(r.total_submissions) }),
                        ]));
                    }
                    table.appendChild(tbody);

                    clear(container);
                    container.appendChild(el('div', { class: 'table-wrap' }, [table]));
                } catch (err) {
                    emptyState(container, 'Failed to load', err.message || 'Unknown error');
                    toast(err.message || 'Failed to load leaderboard', 'error');
                }
            })();
        })();
    </script>
</body>

</html>
