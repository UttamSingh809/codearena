<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        // Apply theme immediately to prevent flash of wrong theme
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Leaderboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" tabindex="-1">
        <h1>Leaderboard</h1>

        <div class="auth-tabs" style="margin-bottom: 24px; max-width: 400px;">
            <button id="tab-global" class="active">Global</button>
            <button id="tab-friends">Friends</button>
        </div>

        <div id="leaderboard-view">
            <div class="loading-block"><span class="spinner"></span><span>Loading…</span></div>
        </div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function () {
            if (!requireAuth('leaderboard')) return;

            const container = document.getElementById('leaderboard-view');
            const tabGlobal = document.getElementById('tab-global');
            const tabFriends = document.getElementById('tab-friends');

            let currentTab = 'global';

            function setActiveTab(tab) {
                currentTab = tab;
                tabGlobal.classList.toggle('active', tab === 'global');
                tabFriends.classList.toggle('active', tab === 'friends');
                loadLeaderboard();
            }

            async function loadLeaderboard() {
                container.innerHTML = `<div class="loading-block"><span class="spinner"></span><span>Loading…</span></div>`;

                try {
                    const endpoint = currentTab === 'global' ? '/api/leaderboard' : '/api/leaderboard/friends';
                    const rows = await apiFetch(endpoint);

                    if (!rows.length) {
                        emptyState(container, 'No rankings yet',
                            currentTab === 'friends' ? 'Follow other users to compare your ranking.' : 'Be the first to submit a solution!');
                        return;
                    }

                    const table = el('table');
                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', { text: 'Rank' }),
                            el('th', { text: 'User' }),
                            el('th', { class: 'num', text: 'Score' }),
                            el('th', { class: 'num', text: 'Solved' }),
                            el('th', { class: 'num', text: 'Submissions' }),
                        ]),
                    ]));
                    const tbody = el('tbody');
                    for (const r of rows) {
                        const rank = r.rank;
                        let medalClass = 'plain';
                        if (rank === 1) medalClass = 'gold';
                        else if (rank === 2) medalClass = 'silver';
                        else if (rank === 3) medalClass = 'bronze';

                        tbody.appendChild(el('tr', {}, [
                            el('td', {}, [
                                el('span', { class: `rank-medal ${medalClass}`, text: String(rank) }),
                            ]),
                            el('td', {}, [
                                el('a', { href: `profile.html?user=${encodeURIComponent(r.username)}`, text: r.username })
                            ]),
                            el('td', { class: 'num', text: String(r.total_score) }),
                            el('td', { class: 'num', text: String(r.total_solved) }),
                            el('td', { class: 'num', text: String(r.total_submissions) }),
                        ]));
                    }
                    table.appendChild(tbody);

                    clear(container);
                    container.appendChild(el('div', { class: 'table-wrap' }, [table]));
                } catch (err) {
                    emptyState(container, 'Failed to load', err.message || 'Failed to load leaderboard');
                    console.error('Failed to load leaderboard:', err);
                }
            }

            tabGlobal.addEventListener('click', () => setActiveTab('global'));
            tabFriends.addEventListener('click', () => setActiveTab('friends'));

            // Load global by default
            loadLeaderboard();
        })();
    </script>
</body>

</html>
