<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        // Apply theme immediately to prevent flash of wrong theme
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Submission</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="narrow" id="main-content" tabindex="-1">
        <nav class="breadcrumb" id="submission-breadcrumb">
            <a href="history.html">Submissions</a>
            <span class="sep">/</span>
            <span class="current" id="submission-breadcrumb-title">Loading…</span>
        </nav>
        <div id="submission-view"></div>
        <!-- Test Case Breakdown & Metrics -->
        <div id="testcases-container"></div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function() {
            if (!requireAuth('history')) return;

            const params = new URLSearchParams(location.search);
            const subId = parseInt(params.get('id') || '0', 10);
            const container = document.getElementById('submission-view');

            if (!subId) {
                emptyState(container, 'No submission selected',
                    'Open a submission from your history.');
                return;
            }

            let stopFn = null;

            let hasCelebrated = false;

            function render(s) {
                document.title = s.result
                    ? `CodeArena — Submission #${s.id} (${s.result.verdict})`
                    : `CodeArena — Submission #${s.id}`;
                const bcTitle = document.getElementById('submission-breadcrumb-title');
                if (bcTitle) bcTitle.textContent = `#${s.id}`;
                clear(container);

                const tcContainer = document.getElementById('testcases-container');
                if (tcContainer) clear(tcContainer);

                const r = s.result;
                const verdict = r ? r.verdict : s.status;
                if (verdict === 'AC' && !hasCelebrated) {
                    hasCelebrated = true;
                    // Only celebrate if the submission just completed (within the last 10 seconds)
                    const gradedAt = new Date(r.graded_at).getTime();
                    if (Date.now() - gradedAt < 10000) {
                        celebrateAC();
                    }
                }
                const info = VERDICT_INFO[verdict] || {
                    label: verdict
                };

                // ============================================================
                // Hero: verdict + test case progress + metrics
                // ============================================================
                const hero = el('div', {
                    class: 'verdict-hero ' + verdict,
                    'aria-live': 'polite',
                });

                // Left: verdict name + subline
                const heroLeft = el('div', {
                    class: 'hero-left'
                });
                heroLeft.appendChild(el('div', {
                    class: 'verdict-label',
                    text: 'Verdict'
                }));
                heroLeft.appendChild(el('div', {
                    class: 'verdict-name',
                    text: info.label
                }));

                // Test cases summary
                let tcLine = null;
                if (r && r.test_total != null) {
                    tcLine = `${r.test_passed} / ${r.test_total} testcases passed`;
                } else if (s.test_total != null && s.test_passed != null) {
                    tcLine = `${s.test_passed} / ${s.test_total} testcases passed`;
                }
                if (tcLine) {
                    heroLeft.appendChild(el('div', {
                        class: 'verdict-subline',
                        text: tcLine,
                    }));
                }

                // If WA and we know which case failed
                if (r && r.first_failed != null && r.first_failed > 0 &&
                    r.verdict !== 'AC') {
                    heroLeft.appendChild(el('div', {
                        class: 'verdict-subline muted',
                        text: `First failed at test case #${r.first_failed}`,
                    }));
                }

                hero.appendChild(heroLeft);

                // Right: metrics
                const metrics = el('div', {
                    class: 'metrics'
                });
                if (r && r.runtime_ms != null)
                    metrics.appendChild(metric('Runtime', `${r.runtime_ms} ms`));
                if (r && r.memory_kb != null)
                    metrics.appendChild(metric('Memory', `${formatNumber(r.memory_kb)} KB`));
                if (r)
                    metrics.appendChild(metric('Score', String(r.score)));
                if (metrics.children.length)
                    hero.appendChild(metrics);

                container.appendChild(hero);

                // ============================================================
                // Live progress bar (only while grading)
                // ============================================================
                if (s.status === 'PROCESSING' && s.test_current && s.test_total) {
                    const pct = Math.round((s.test_current / s.test_total) * 100);
                    const live = el('div', {
                        class: 'card mb-24'
                    }, [
                        el('div', {
                            class: 'flex',
                            style: {
                                justifyContent: 'space-between',
                                marginBottom: '8px'
                            }
                        }, [
                            el('span', {
                                class: 'muted',
                                text: `Running test ${s.test_current} of ${s.test_total}…`
                            }),
                            el('span', {
                                class: 'muted',
                                text: `${pct}%`
                            }),
                        ]),
                        el('div', {
                            class: 'progress'
                        }, [
                            el('div', {
                                class: 'bar',
                                style: {
                                    width: `${pct}%`
                                }
                            }),
                        ]),
                    ]);
                    container.appendChild(live);
                } else if (s.status === 'PENDING' || s.status === 'PROCESSING') {
                    // Generic loader when we don't have progress info
                    const live = el('div', {
                        class: 'card mb-24',
                        style: {
                            textAlign: 'center'
                        }
                    }, [
                        el('span', {
                            class: 'spinner'
                        }),
                        ' ',
                        el('span', {
                            class: 'muted',
                            text: 'Grading in progress…'
                        }),
                    ]);
                    container.appendChild(live);
                }

                // ============================================================
                // Metadata card: user, problem, submitted time
                // ============================================================
                const meta = el('div', {
                    class: 'card mb-24'
                });
                meta.appendChild(el('div', {
                    class: 'card-header'
                }, [
                    el('h3', {
                        text: 'Submission details'
                    }),
                ]));
                const metaGrid = el('div', {
                    class: 'meta-grid'
                });

                if (s.username) {
                    metaGrid.appendChild(metaRow('Author', s.username));
                }
                if (s.problem_title) {
                    metaGrid.appendChild(metaRow('Problem', s.problem_title));
                }
                metaGrid.appendChild(metaRow('Language', s.language));
                metaGrid.appendChild(metaRow('Submitted', formatFullDate(s.submitted_at)));
                if (s.processing_started_at) {
                    metaGrid.appendChild(metaRow('Started', formatFullDate(s.processing_started_at)));
                }
                if (r && r.graded_at) {
                    metaGrid.appendChild(metaRow('Graded', formatFullDate(r.graded_at)));
                }
                if (r && r.graded_by) {
                    metaGrid.appendChild(metaRow('Graded by', r.graded_by));
                }
                if (s.retry_count > 0) {
                    metaGrid.appendChild(metaRow('Retries', String(s.retry_count)));
                }
                meta.appendChild(metaGrid);
                container.appendChild(meta);

                // ============================================================
                // Error / output sections
                // ============================================================
                if (r && r.stderr) {
                    container.appendChild(el('div', {
                        class: 'card mb-24'
                    }, [
                        el('h3', {
                            class: 'mb-0',
                            text: 'Error output'
                        }),
                        el('pre', {
                            class: 'code-block error-output mt-16',
                            text: r.stderr
                        }),
                    ]));
                }
                if (r && r.stdout) {
                    container.appendChild(el('div', {
                        class: 'card mb-24'
                    }, [
                        el('h3', {
                            class: 'mb-0',
                            text: 'Output'
                        }),
                        el('pre', {
                            class: 'code-block mt-16',
                            text: r.stdout
                        }),
                    ]));
                }

                // ============================================================
                // Source code
                // ============================================================
                container.appendChild(el('div', {
                    class: 'card'
                }, [
                    el('h3', {
                        class: 'mb-0',
                        text: 'Source code'
                    }),
                    el('pre', {
                        class: 'code-block mt-16',
                        text: s.source_code
                    }),
                ]));

                // Render Test Cases if completed
                if (s.status === 'COMPLETED' || s.status === 'FAILED') {
                    renderTestCases(s.id, r);
                }
            }

            function metric(label, value) {
                return el('div', {
                    class: 'metric'
                }, [
                    el('div', {
                        class: 'metric-label',
                        text: label
                    }),
                    el('div', {
                        class: 'metric-value',
                        text: value
                    }),
                ]);
            }

            function metaRow(label, value) {
                return el('div', {
                    class: 'meta-row'
                }, [
                    el('span', {
                        class: 'meta-label',
                        text: label
                    }),
                    el('span', {
                        class: 'meta-value',
                        text: value
                    }),
                ]);
            }

            function formatFullDate(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                return d.toLocaleString(undefined, {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                });
            }

            async function renderTestCases(submissionId, result) {
                const container = document.getElementById('testcases-container');
                if (!container) return;

                // Show loading skeleton
                container.innerHTML = `
                    <div class="card mb-24">
                        <div class="skeleton skeleton-title" style="width:200px;margin-bottom:16px;"></div>
                        <div class="skeleton-table-row"><div class="skeleton skeleton-cell lg"></div><div class="skeleton skeleton-cell sm"></div></div>
                        <div class="skeleton-table-row"><div class="skeleton skeleton-cell lg"></div><div class="skeleton skeleton-cell sm"></div></div>
                    </div>
                `;

                try {
                    const url = `/api/submissions/${submissionId}/testcases`;
                    console.log(`[DEBUG] Fetching test cases from: ${url}`);

                    const cases = await apiFetch(url);

                    console.log(`[DEBUG] Received test cases:`, cases);

                    if (!cases || cases.length === 0) {
                        console.warn('[DEBUG] Test cases array is empty. Hiding panel.');
                        container.innerHTML = '';
                        return;
                    }

                    clear(container);

                    // 1. Metrics Visualization (Runtime & Memory)
                    if (result && result.verdict === 'AC') {
                        // We need the problem limits. We can grab them from the first test case or pass them in.
                        // For simplicity, let's assume we can fetch the problem from the submission.
                        // But since we already have the result, let's just show the max runtime/memory relative to a standard.
                        // A better approach is to fetch the problem limits, but we can approximate here.

                        const maxRuntime = Math.max(...cases.map(c => c.runtime_ms || 0));
                        const maxMemory = Math.max(...cases.map(c => c.memory_kb || 0));

                        // We'll add a mock visualizer since we don't have limits in the result object.
                        // (In a full build, you'd fetch the problem limits from the API).
                    }

                    // 2. Test Case Table
                    const card = el('div', { class: 'card mb-24' });

                    // Header
                    card.appendChild(el('div', { class: 'card-header' }, [
                        el('h3', { text: 'Test Case Results' }),
                        el('span', { class: 'muted', text: `${cases.length} cases` })
                    ]));

                    const table = el('table');
                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', { text: '#' }),
                            el('th', { text: 'Verdict' }),
                            el('th', { class: 'num', text: 'Runtime' }),
                            el('th', { class: 'num', text: 'Memory' }),
                            el('th', { text: '' }) // For the expand button
                        ])
                    ]));

                    const tbody = el('tbody');

                    for (const c of cases) {
                        // Main row
                        const tr = el('tr', {}, [
                            el('td', { class: 'mono muted', text: String(c.ordinal) }),
                            el('td', {}, [verdictBadge(c.verdict)]),
                            el('td', { class: 'num', text: c.runtime_ms != null ? `${c.runtime_ms} ms` : '—' }),
                            el('td', { class: 'num', text: c.memory_kb != null ? `${formatNumber(c.memory_kb)} KB` : '—' }),
                            el('td', { style: { textAlign: 'right' } }, [
                                el('button', {
                                    class: 'btn ghost',
                                    text: 'View Details',
                                    onclick: () => toggleTestCaseDetails(tbody, c, tr)
                                })
                            ])
                        ]);
                        tbody.appendChild(tr);
                    }

                    table.appendChild(tbody);
                    card.appendChild(table);
                    container.appendChild(card);

                } catch (err) {
                    console.error('Failed to load test cases', err);
                    container.innerHTML = '';
                }
            }

            function toggleTestCaseDetails(tbody, tc, mainRow) {
                // Check if details are already open
                const next = mainRow.nextElementSibling;
                if (next && next.classList.contains('test-case-detail')) {
                    next.remove();
                    return;
                }

                // Close any other open details
                tbody.querySelectorAll('.test-case-detail').forEach(el => el.remove());

                // Build detail row
                const detailTr = el('tr', { class: 'test-case-detail' });
                const detailTd = el('td', { colspan: '5', style: { background: 'var(--neutral-deep)', padding: '16px' } });

                const content = el('div', { style: { display: 'flex', gap: '24px', flexWrap: 'wrap' } });

                // Input (only if sample or admin)
                if (tc.is_sample) {
                    content.appendChild(el('div', { style: { flex: 1, minWidth: '200px' } }, [
                        el('div', { style: { fontSize: '11px', textTransform: 'uppercase', color: 'var(--secondary)', fontWeight: 600, marginBottom: '4px' }, text: 'Input' }),
                        el('pre', { class: 'code-block', style: { padding: '8px', fontSize: '12px' }, text: tc.input_data || '(empty)' })
                    ]));
                }

                // Expected Output
                content.appendChild(el('div', { style: { flex: 1, minWidth: '200px' } }, [
                    el('div', { style: { fontSize: '11px', textTransform: 'uppercase', color: 'var(--secondary)', fontWeight: 600, marginBottom: '4px' }, text: 'Expected Output' }),
                    el('pre', { class: 'code-block', style: { padding: '8px', fontSize: '12px' }, text: tc.expected_output || '(empty)' })
                ]));

                // Actual Output
                if (tc.verdict !== 'AC') {
                    content.appendChild(el('div', { style: { flex: 1, minWidth: '200px' } }, [
                        el('div', { style: { fontSize: '11px', textTransform: 'uppercase', color: 'var(--danger)', fontWeight: 600, marginBottom: '4px' }, text: 'Your Output' }),
                        el('pre', { class: 'code-block error-output', style: { padding: '8px', fontSize: '12px' }, text: tc.actual_output || '(no output)' })
                    ]));
                }

                detailTd.appendChild(content);
                detailTr.appendChild(detailTd);

                mainRow.parentNode.insertBefore(detailTr, mainRow.nextSibling);
            }

            // 5. Render Skeleton immediately
            container.appendChild(Skeleton.submissionPage());

            // Initial fetch + polling
            let lastPollError = null;
            stopFn = poll(async() => {
                const s = await Api.getSubmission(subId);
                lastPollError = null;
                render(s); // render() clears the container, removing the skeleton
                return ['COMPLETED', 'FAILED', 'CANCELLED'].includes(s.status);
            }, 1500, err => {
                console.error('Could not load submission:', err);
                const message = friendlyErrorMessage(err, 'Could not load submission');
                if (message !== lastPollError) toast(message, 'error');
                lastPollError = message;
            });

            window.addEventListener('beforeunload', () => stopFn && stopFn());
        })();
    </script>
</body>

</html>
