<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeArena — Submission</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>

<body>
    <main class="narrow">
        <nav class="breadcrumb" id="submission-breadcrumb">
            <a href="history.html">Submissions</a>
            <span class="sep">/</span>
            <span class="current" id="submission-breadcrumb-title">Loading…</span>
        </nav>
        <div id="submission-view"></div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function() {
            if (!requireAuth('history')) return;

            const params = new URLSearchParams(location.search);
            const subId = parseInt(params.get('id') || '0', 10);
            const container = document.getElementById('submission-view');

            if (!subId) {
                emptyState(container, 'No submission selected',
                    'Open a submission from your history.');
                return;
            }

            let stopFn = null;

            let hasCelebrated = false;

            function render(s) {
                document.title = `CodeArena — Submission #${s.id}`;
                const bcTitle = document.getElementById('submission-breadcrumb-title');
                if (bcTitle) bcTitle.textContent = `#${s.id}`;
                clear(container);

                const r = s.result;
                const verdict = r ? r.verdict : s.status;
                if (verdict === 'AC' && !hasCelebrated) {
                    hasCelebrated = true;
                    // Only celebrate if the submission just completed (within the last 10 seconds)
                    const gradedAt = new Date(r.graded_at).getTime();
                    if (Date.now() - gradedAt < 10000) {
                        celebrateAC();
                    }
                }
                const info = VERDICT_INFO[verdict] || {
                    label: verdict
                };

                // ============================================================
                // Hero: verdict + test case progress + metrics
                // ============================================================
                const hero = el('div', {
                    class: 'verdict-hero ' + verdict
                });

                // Left: verdict name + subline
                const heroLeft = el('div', {
                    class: 'hero-left'
                });
                heroLeft.appendChild(el('div', {
                    class: 'verdict-label',
                    text: 'Verdict'
                }));
                heroLeft.appendChild(el('div', {
                    class: 'verdict-name',
                    text: info.label
                }));

                // Test cases summary
                let tcLine = null;
                if (r && r.test_total != null) {
                    tcLine = `${r.test_passed} / ${r.test_total} testcases passed`;
                } else if (s.test_total != null && s.test_passed != null) {
                    tcLine = `${s.test_passed} / ${s.test_total} testcases passed`;
                }
                if (tcLine) {
                    heroLeft.appendChild(el('div', {
                        class: 'verdict-subline',
                        text: tcLine,
                    }));
                }

                // If WA and we know which case failed
                if (r && r.first_failed != null && r.first_failed > 0 &&
                    r.verdict !== 'AC') {
                    heroLeft.appendChild(el('div', {
                        class: 'verdict-subline muted',
                        text: `First failed at test case #${r.first_failed}`,
                    }));
                }

                hero.appendChild(heroLeft);

                // Right: metrics
                const metrics = el('div', {
                    class: 'metrics'
                });
                if (r && r.runtime_ms != null)
                    metrics.appendChild(metric('Runtime', `${r.runtime_ms} ms`));
                if (r && r.memory_kb != null)
                    metrics.appendChild(metric('Memory', `${formatNumber(r.memory_kb)} KB`));
                if (r)
                    metrics.appendChild(metric('Score', String(r.score)));
                if (metrics.children.length)
                    hero.appendChild(metrics);

                container.appendChild(hero);

                // ============================================================
                // Live progress bar (only while grading)
                // ============================================================
                if (s.status === 'PROCESSING' && s.test_current && s.test_total) {
                    const pct = Math.round((s.test_current / s.test_total) * 100);
                    const live = el('div', {
                        class: 'card mb-24'
                    }, [
                        el('div', {
                            class: 'flex',
                            style: {
                                justifyContent: 'space-between',
                                marginBottom: '8px'
                            }
                        }, [
                            el('span', {
                                class: 'muted',
                                text: `Running test ${s.test_current} of ${s.test_total}…`
                            }),
                            el('span', {
                                class: 'muted',
                                text: `${pct}%`
                            }),
                        ]),
                        el('div', {
                            class: 'progress'
                        }, [
                            el('div', {
                                class: 'bar',
                                style: {
                                    width: `${pct}%`
                                }
                            }),
                        ]),
                    ]);
                    container.appendChild(live);
                } else if (s.status === 'PENDING' || s.status === 'PROCESSING') {
                    // Generic loader when we don't have progress info
                    const live = el('div', {
                        class: 'card mb-24',
                        style: {
                            textAlign: 'center'
                        }
                    }, [
                        el('span', {
                            class: 'spinner'
                        }),
                        ' ',
                        el('span', {
                            class: 'muted',
                            text: 'Grading in progress…'
                        }),
                    ]);
                    container.appendChild(live);
                }

                // ============================================================
                // Metadata card: user, problem, submitted time
                // ============================================================
                const meta = el('div', {
                    class: 'card mb-24'
                });
                meta.appendChild(el('div', {
                    class: 'card-header'
                }, [
                    el('h3', {
                        text: 'Submission details'
                    }),
                ]));
                const metaGrid = el('div', {
                    class: 'meta-grid'
                });

                if (s.username) {
                    metaGrid.appendChild(metaRow('Author', s.username));
                }
                if (s.problem_title) {
                    metaGrid.appendChild(metaRow('Problem', s.problem_title));
                }
                metaGrid.appendChild(metaRow('Language', s.language));
                metaGrid.appendChild(metaRow('Submitted', formatFullDate(s.submitted_at)));
                if (s.processing_started_at) {
                    metaGrid.appendChild(metaRow('Started', formatFullDate(s.processing_started_at)));
                }
                if (r && r.graded_at) {
                    metaGrid.appendChild(metaRow('Graded', formatFullDate(r.graded_at)));
                }
                if (r && r.graded_by) {
                    metaGrid.appendChild(metaRow('Graded by', r.graded_by));
                }
                if (s.retry_count > 0) {
                    metaGrid.appendChild(metaRow('Retries', String(s.retry_count)));
                }
                meta.appendChild(metaGrid);
                container.appendChild(meta);

                // ============================================================
                // Error / output sections
                // ============================================================
                if (r && r.stderr) {
                    container.appendChild(el('div', {
                        class: 'card mb-24'
                    }, [
                        el('h3', {
                            class: 'mb-0',
                            text: 'Error output'
                        }),
                        el('pre', {
                            class: 'code-block error-output mt-16',
                            text: r.stderr
                        }),
                    ]));
                }
                if (r && r.stdout) {
                    container.appendChild(el('div', {
                        class: 'card mb-24'
                    }, [
                        el('h3', {
                            class: 'mb-0',
                            text: 'Output'
                        }),
                        el('pre', {
                            class: 'code-block mt-16',
                            text: r.stdout
                        }),
                    ]));
                }

                // ============================================================
                // Source code
                // ============================================================
                container.appendChild(el('div', {
                    class: 'card'
                }, [
                    el('h3', {
                        class: 'mb-0',
                        text: 'Source code'
                    }),
                    el('pre', {
                        class: 'code-block mt-16',
                        text: s.source_code
                    }),
                ]));
            }

            function metric(label, value) {
                return el('div', {
                    class: 'metric'
                }, [
                    el('div', {
                        class: 'metric-label',
                        text: label
                    }),
                    el('div', {
                        class: 'metric-value',
                        text: value
                    }),
                ]);
            }

            function metaRow(label, value) {
                return el('div', {
                    class: 'meta-row'
                }, [
                    el('span', {
                        class: 'meta-label',
                        text: label
                    }),
                    el('span', {
                        class: 'meta-value',
                        text: value
                    }),
                ]);
            }

            function formatFullDate(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                return d.toLocaleString(undefined, {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                });
            }

            // 5. Render Skeleton immediately
            container.appendChild(Skeleton.submissionPage());

            // Initial fetch + polling
            stopFn = poll(async() => {
                const s = await Api.getSubmission(subId);
                render(s); // render() clears the container, removing the skeleton
                return ['COMPLETED', 'FAILED', 'CANCELLED'].includes(s.status);
            }, 1500);

            window.addEventListener('beforeunload', () => stopFn && stopFn());
        })();
    </script>
</body>

</html>
