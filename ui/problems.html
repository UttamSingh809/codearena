<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeArena — Problems</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <main>
        <h1>Problems</h1>
        <p class="muted mb-24">Solve algorithmic problems, submit your code, and see how you rank.</p>

        <div class="filter-bar">
            <input type="search" id="search" placeholder="Search problems…">
            <select id="difficulty-filter">
                <option value="">All difficulties</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div id="problems-view">
            <div class="loading-block"><span class="spinner"></span><span>Loading…</span></div>
        </div>
    </main>

    <script src="static/app.js"></script>
    <script>
        'use strict';

        (function () {
            if (!requireAuth('problems')) return;

            const container = document.getElementById('problems-view');
            const search = document.getElementById('search');
            const diffFilter = document.getElementById('difficulty-filter');
            let allProblems = [];

            function render() {
                const q = search.value.trim().toLowerCase();
                const d = diffFilter.value;
                const filtered = allProblems.filter(p => {
                    if (d && p.difficulty !== d) return false;
                    if (q && !p.title.toLowerCase().includes(q)) return false;
                    return true;
                });

                if (!filtered.length) {
                    emptyState(container, 'No problems match',
                        allProblems.length
                            ? 'Try adjusting your filters.'
                            : 'No problems are available yet.');
                    return;
                }

                const table = el('table');
                table.appendChild(el('thead', {}, [
                    el('tr', {}, [
                        el('th', { text: '#' }),
                        el('th', { text: 'Title' }),
                        el('th', { text: 'Difficulty' }),
                        el('th', { class: 'num', text: 'Time limit' }),
                        el('th', { class: 'num', text: 'Memory limit' }),
                    ]),
                ]));
                const tbody = el('tbody');
                for (const p of filtered) {
                    tbody.appendChild(el('tr', {}, [
                        el('td', { class: 'mono muted', text: String(p.id) }),
                        el('td', {}, [
                            el('a', { href: `problem.html?id=${p.id}`, text: p.title }),
                        ]),
                        el('td', {}, [difficultyBadge(p.difficulty)]),
                        el('td', { class: 'num', text: `${p.time_limit_ms} ms` }),
                        el('td', { class: 'num', text: `${p.memory_limit_mb} MB` }),
                    ]));
                }
                table.appendChild(tbody);

                clear(container);
                container.appendChild(el('div', { class: 'table-wrap' }, [table]));
            }

            search.addEventListener('input', render);
            diffFilter.addEventListener('change', render);

            (async () => {
                try {
                    allProblems = await Api.listProblems();
                    render();
                } catch (err) {
                    clear(container);
                    container.appendChild(el('div', { class: 'card' }, [
                        el('p', { text: err.message || 'Failed to load problems' }),
                    ]));
                    toast(err.message || 'Failed to load problems', 'error');
                }
            })();
        })();
    </script>
</body>

</html>
